services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: segmentdb
      POSTGRES_USER: segmentuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - database_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    networks:
      data_net:
        ipv4_address: 172.28.30.30

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  database_data:
    name: segment_database_data

networks:
  data_net:
    name: segment_data
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
