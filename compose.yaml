services:
  gateway:
    build:
      context: ./gateway

    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      api:
        condition: service_healthy

    networks:
      edge_net:
        ipv4_address: 172.28.10.10
      app_net:
        ipv4_address: 172.28.20.10

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    mem_limit: 128m

  api:
    build:
      context: ./api
      args:
        APP_UID: ${APP_UID:-10001}

    restart: unless-stopped

    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: segmentdb
      DB_USER: segmentuser
      DB_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    depends_on:
      database:
        condition: service_healthy

    networks:
      app_net:
        ipv4_address: 172.28.20.20
      data_net:
        ipv4_address: 172.28.30.20

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    mem_limit: 256m

  database:
    image: postgres:18-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: segmentdb
      POSTGRES_USER: segmentuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    volumes:
      - database_data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    networks:
      data_net:
        ipv4_address: 172.28.30.30

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  database_data:
    name: segment_database_data

networks:
  edge_net:
    name: segment_edge
    ipam:
      config:
        - subnet: 172.28.10.0/24

  app_net:
    name: segment_app
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24

  data_net:
    name: segment_data
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
